<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algorithm Lab</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10263D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#E9EFF5;--paper:#F8FAFC;--ink:#10263D;--mute:#5B7089;--a:#E8590C;--b:#1C6DD0;--c:#2B9348;--line:#C5D2E0;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1B2B;--paper:#10263D;--ink:#E6EEF7;--mute:#8FA6BF;--a:#FF8A3D;--b:#5AA2FF;--c:#4CD07D;--line:#27425F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1B2B;--paper:#10263D;--ink:#E6EEF7;--mute:#8FA6BF;--a:#FF8A3D;--b:#5AA2FF;--c:#4CD07D;--line:#27425F;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:940px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 2px}
.sub{color:var(--mute);margin:0 0 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tabs{display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
button,select{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.tabs button{border:0;border-radius:0;background:transparent}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button.go{background:var(--a);border-color:var(--a);color:#fff;font-weight:600;min-width:84px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--b);outline-offset:2px}
label{display:flex;align-items:center;gap:8px;color:var(--mute)}
input[type=range]{accent-color:var(--a);width:120px}
canvas{display:block;width:100%;height:auto;background:var(--paper);border:1.5px solid var(--ink);border-radius:10px;touch-action:none}
.info{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:10px;color:var(--mute)}
.key{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;color:var(--mute);font-size:13px}
.key i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
</style></head><body><main>
<h1>Algorithm Lab</h1>
<p class="sub">Watch sorting, pathfinding and graph traversal run one step at a time.</p>
<div class="bar">
<div class="tabs" id="tabs"><button data-m="sort" aria-pressed="true">Sorting</button><button data-m="grid" aria-pressed="false">Pathfinding</button><button data-m="graph" aria-pressed="false">Graph</button><button data-m="race" aria-pressed="false">Race</button><button data-m="scale" aria-pressed="false">Scaling</button></div>
<select id="sel" aria-label="Algorithm"></select><select id="sel2" aria-label="Second algorithm" hidden></select>
</div>
<div class="bar">
<button class="go" id="play">Play</button><button id="stp">Step</button><button id="rst">Reset</button><button id="new">New</button>
<label>Slow <input type="range" id="spd" min="1" max="100" value="55" aria-label="Speed"> Fast</label>
</div>
<canvas id="cv"></canvas>
<div class="key" id="key"></div>
<div class="info"><span id="desc"></span><span id="stat"></span></div>
</main>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),g=cv.getContext('2d'),W=900,H=450;
cv.width=W*2;cv.height=H*2;g.scale(2,2);
const C={};
function col(){const s=getComputedStyle(document.documentElement);['bg','paper','ink','mute','a','b','c','line'].forEach(k=>C[k]=s.getPropertyValue('--'+k).trim())}
let ended=false,mode='sort',gen=null,timer=null,steps=0,playing=false,over=false;

/* ---------- Sorting ---------- */
const N=48;let arr=[],hl=[],fin=false;
const SA={
bubble:{n:'Bubble sort',i:'Swaps neighbours until nothing moves. O(n²) time, O(1) space.',f:function*(a){for(let i=0;i<a.length;i++)for(let j=0;j<a.length-i-1;j++){yield[j,j+1];if(a[j]>a[j+1]){[a[j],a[j+1]]=[a[j+1],a[j]];yield[j,j+1]}}}},
insertion:{n:'Insertion sort',i:'Slides each item left into place. O(n²) worst case, fast on nearly sorted data.',f:function*(a){for(let i=1;i<a.length;i++){let j=i;while(j>0&&a[j-1]>a[j]){yield[j-1,j];[a[j-1],a[j]]=[a[j],a[j-1]];j--}yield[j]}}},
selection:{n:'Selection sort',i:'Finds the minimum, places it first. O(n²) time, at most n swaps.',f:function*(a){for(let i=0;i<a.length;i++){let m=i;for(let j=i+1;j<a.length;j++){yield[m,j];if(a[j]<a[m])m=j}[a[i],a[m]]=[a[m],a[i]];yield[i,m]}}},
merge:{n:'Merge sort',i:'Splits, sorts halves, merges. O(n log n) time, O(n) space, stable.',f:function*(a){const t=a.slice();function*ms(l,r){if(r<=l)return;const m=(l+r)>>1;yield*ms(l,m);yield*ms(m+1,r);let i=l,j=m+1,k=l;while(i<=m&&j<=r){yield[i,j];t[k++]=a[i]<=a[j]?a[i++]:a[j++]}while(i<=m)t[k++]=a[i++];while(j<=r)t[k++]=a[j++];for(k=l;k<=r;k++){a[k]=t[k];yield[k]}}yield*ms(0,a.length-1)}},
quick:{n:'Quick sort',i:'Partitions around a pivot. O(n log n) average, O(n²) worst case.',f:function*(a){function*qs(l,r){if(l>=r)return;const p=a[r];let i=l;for(let j=l;j<r;j++){yield[j,r];if(a[j]<p){[a[i],a[j]]=[a[j],a[i]];i++;yield[i-1,j]}}[a[i],a[r]]=[a[r],a[i]];yield[i,r];yield*qs(l,i-1);yield*qs(i+1,r)}yield*qs(0,a.length-1)}},
shell:{n:'Shell sort',i:'Insertion sort over shrinking gaps. Roughly O(n^1.3) in practice, O(1) space.',f:function*(a){for(let gp=a.length>>1;gp>0;gp>>=1)for(let i=gp;i<a.length;i++){let j=i;while(j>=gp&&a[j-gp]>a[j]){yield[j-gp,j];[a[j-gp],a[j]]=[a[j],a[j-gp]];j-=gp}}}},
cocktail:{n:'Cocktail shaker sort',i:'Bubble sort in both directions each pass. O(n²) time, O(1) space.',f:function*(a){let s=true,lo=0,hi=a.length-1;while(s){s=false;for(let i=lo;i<hi;i++){yield[i,i+1];if(a[i]>a[i+1]){[a[i],a[i+1]]=[a[i+1],a[i]];s=true}}hi--;for(let i=hi;i>lo;i--){yield[i-1,i];if(a[i-1]>a[i]){[a[i-1],a[i]]=[a[i],a[i-1]];s=true}}lo++}}},
heap:{n:'Heap sort',i:'Builds a max-heap, then pops the largest. O(n log n) time, O(1) space.',f:function*(a){const n=a.length;function*sift(s,e){let r=s;while(2*r+1<e){let c=2*r+1;if(c+1<e&&a[c]<a[c+1])c++;yield[r,c];if(a[r]<a[c]){[a[r],a[c]]=[a[c],a[r]];r=c}else return}}for(let s=(n>>1)-1;s>=0;s--)yield*sift(s,n);for(let e=n-1;e>0;e--){[a[0],a[e]]=[a[e],a[0]];yield[0,e];yield*sift(0,e)}}}
};
const sortM={algos:SA,
fresh(){arr=[...Array(N)].map((_,i)=>i+1);for(let i=N-1;i>0;i--){const j=Math.random()*(i+1)|0;[arr[i],arr[j]]=[arr[j],arr[i]]}hl=[];fin=false},
reset(){this.fresh()},
start(k){return SA[k].f(arr)},
onStep(v){hl=v},done(){hl=[];fin=true},
key:[['b','Unsorted'],['a','Being compared or moved'],['c','Sorted']],
draw(){const w=W/N;arr.forEach((v,i)=>{const h=v/N*(H-20);g.fillStyle=fin?C.c:hl.includes(i)?C.a:C.b;g.fillRect(i*w+1,H-h,w-2,h)})}};

/* ---------- Pathfinding ---------- */
const GW=32,GH=16,CS=W/GW,S0=3+8*GW,G0=28+8*GW;
let walls=new Uint8Array(GW*GH),st=new Uint8Array(GW*GH);
const nb=c=>{const x=c%GW,y=c/GW|0,r=[];if(x>0)r.push(c-1);if(y>0)r.push(c-GW);if(x<GW-1)r.push(c+1);if(y<GH-1)r.push(c+GW);return r};
function*search(kind){const n=GW*GH,prev=new Int32Array(n).fill(-1),seen=new Uint8Array(n),cost=new Float32Array(n);
const h=i=>Math.abs(i%GW-G0%GW)+Math.abs((i/GW|0)-(G0/GW|0));let open=[S0];seen[S0]=1;
while(open.length){let k=0;if(kind=='dfs')k=open.length-1;else if(kind=='astar'||kind=='greedy'){let b=1e9;open.forEach((q,j)=>{const f=kind=='astar'?cost[q]+h(q):h(q);if(f<b){b=f;k=j}})}
const c=open.splice(k,1)[0];st[c]=2;yield;if(c==G0)break;
for(const q of nb(c)){if(walls[q]||seen[q])continue;seen[q]=1;prev[q]=c;cost[q]=cost[c]+1;open.push(q);st[q]=1}}
if(seen[G0])for(let c=prev[G0];c>=0&&c!=S0;c=prev[c]){st[c]=3;yield}else over='nopath'}
const GA={bfs:{n:'Breadth-first search',i:'Explores in rings; finds the shortest path on an unweighted grid.',f:()=>search('bfs')},
dfs:{n:'Depth-first search',i:'Dives down one branch first; finds a path, not the shortest.',f:()=>search('dfs')},
astar:{n:'A* search',i:'Ranks cells by distance travelled plus estimated distance left; shortest path, fewer cells.',f:()=>search('astar')},
greedy:{n:'Greedy best-first',i:'Always heads toward the goal; fast but not guaranteed shortest.',f:()=>search('greedy')}};
let paint=-1;
const gridM={algos:GA,
fresh(){walls=new Uint8Array(GW*GH);for(let i=0;i<walls.length;i++)if(i!=S0&&i!=G0&&Math.random()<.24)walls[i]=1;st=new Uint8Array(GW*GH)},
reset(){st=new Uint8Array(GW*GH)},
start(k){return GA[k].f()},onStep(){},done(){},
key:[['ink','Wall (click or drag to draw)'],['b','Frontier'],['b2','Visited'],['c','Shortest path found'],['a','Goal']],
draw(){for(let i=0;i<walls.length;i++){const x=i%GW*CS,y=(i/GW|0)*CS;
if(walls[i]){g.fillStyle=C.ink;g.fillRect(x,y,CS,CS)}else if(st[i]){g.fillStyle=st[i]==3?C.c:C.b;g.globalAlpha=st[i]==1?.35:st[i]==2?.7:1;g.fillRect(x+.5,y+.5,CS-1,CS-1);g.globalAlpha=1}
else{g.strokeStyle=C.line;g.strokeRect(x,y,CS,CS)}}
[[S0,C.c],[G0,C.a]].forEach(([i,c])=>{g.fillStyle=c;g.beginPath();g.arc(i%GW*CS+CS/2,(i/GW|0)*CS+CS/2,CS*.38,0,7);g.fill()})}};

/* ---------- Graph ---------- */
let nodes=[],edges=[],adj=[],gs={};
function*gsearch(kind){const n=nodes.length,vis=new Set();gs={cur:-1,vis,ord:{},tree:new Set(),dist:{}};
const tk=(a,b)=>Math.min(a,b)+'-'+Math.max(a,b),mark=(v,p)=>{vis.add(v);gs.cur=v;if(p>=0)gs.tree.add(tk(v,p));gs.ord[v]=vis.size};
if(kind=='dijkstra'){const d=Array(n).fill(1e9),pr=Array(n).fill(-1);d[0]=0;const q=new Set([0]);
while(q.size){let u=-1;q.forEach(v=>{if(u<0||d[v]<d[u])u=v});q.delete(u);mark(u,pr[u]);gs.dist[u]=d[u];yield;
for(const[v,w]of adj[u])if(!vis.has(v)&&d[u]+w<d[v]){d[v]=d[u]+w;pr[v]=u;q.add(v)}}}
else if(kind=='prim'){const d=Array(n).fill(1e9),pr=Array(n).fill(-1);d[0]=0;const q=new Set([0]);while(q.size){let u=-1;q.forEach(v=>{if(u<0||d[v]<d[u])u=v});q.delete(u);mark(u,pr[u]);yield;for(const[v,w]of adj[u])if(!vis.has(v)&&w<d[v]){d[v]=w;pr[v]=u;q.add(v)}}}
else if(kind=='bfs'){const q=[[0,-1]],seen=new Set([0]);while(q.length){const[u,p]=q.shift();mark(u,p);yield;for(const[v]of adj[u])if(!seen.has(v)){seen.add(v);q.push([v,u])}}}
else{const s=[[0,-1]];while(s.length){const[u,p]=s.pop();if(vis.has(u))continue;mark(u,p);yield;for(const[v]of adj[u].slice().reverse())if(!vis.has(v))s.push([v,u])}}
gs.cur=-1}
const RA={bfs:{n:'Breadth-first search',i:'Visits nodes by hop count from node 0. Thick edges show the BFS tree.',f:()=>gsearch('bfs')},
dfs:{n:'Depth-first search',i:'Follows one path as deep as it goes, then backtracks. Thick edges show the DFS tree.',f:()=>gsearch('dfs')},
prim:{n:"Prim's spanning tree",i:'Grows a minimum spanning tree from node 0, always adding the cheapest edge. Thick edges form the tree.',f:()=>gsearch('prim')},
dijkstra:{n:"Dijkstra's shortest paths",i:'Always settles the nearest unvisited node. Numbers are distances from node 0; thick edges are shortest paths.',f:()=>gsearch('dijkstra')}};
const graphM={algos:RA,
fresh(){const n=10;nodes=[...Array(n)].map((_,i)=>{const t=i/n*6.283-1.57,r=150+Math.random()*50;return{x:W/2+Math.cos(t)*r*1.7,y:H/2+Math.sin(t)*r*.95}});
const m=new Map(),add=(a,b)=>{if(a!=b)m.set(Math.min(a,b)+'-'+Math.max(a,b),[Math.min(a,b),Math.max(a,b),1+Math.random()*8|0])};
for(let i=0;i<n;i++)add(i,(i+1)%n);for(let k=0;k<6;k++)add(Math.random()*n|0,Math.random()*n|0);
edges=[...m.values()];adj=nodes.map(()=>[]);edges.forEach(([a,b,w])=>{adj[a].push([b,w]);adj[b].push([a,w])});gs={cur:-1,vis:new Set(),ord:{},tree:new Set(),dist:{}}},
reset(){gs={cur:-1,vis:new Set(),ord:{},tree:new Set(),dist:{}}},
start(k){return RA[k].f()},onStep(){},done(){},
key:[['paper','Unvisited'],['b','Visited (number = order or distance)'],['a','Current node'],['b2','Thick edge = tree or shortest path']],
draw(){g.font='13px system-ui';g.textAlign='center';g.textBaseline='middle';
edges.forEach(([a,b,w])=>{const t=gs.tree.has(a+'-'+b);g.strokeStyle=t?C.b:C.line;g.lineWidth=t?4:2;g.beginPath();g.moveTo(nodes[a].x,nodes[a].y);g.lineTo(nodes[b].x,nodes[b].y);g.stroke();
const x=(nodes[a].x+nodes[b].x)/2,y=(nodes[a].y+nodes[b].y)/2;g.fillStyle=C.paper;g.fillRect(x-9,y-9,18,18);g.fillStyle=C.mute;g.fillText(w,x,y)});
nodes.forEach((p,i)=>{const v=gs.vis.has(i);g.fillStyle=gs.cur==i?C.a:v?C.b:C.paper;g.strokeStyle=C.ink;g.lineWidth=i==0?4:2;g.beginPath();g.arc(p.x,p.y,19,0,7);g.fill();g.stroke();
g.fillStyle=v?'#fff':C.ink;g.font='bold 14px system-ui';g.fillText(v?(sel.value=='dijkstra'?gs.dist[i]:gs.ord[i]):i,p.x,p.y)});g.lineWidth=1}};

/* ---------- Race ---------- */
let rO=[],rA=[],rB=[],rh=[[],[]],rc=[0,0],rd=[false,false];
const raceM={algos:SA,
fresh(){sortM.fresh();rO=arr.slice();this.reset()},
reset(){rA=rO.slice();rB=rO.slice();rh=[[],[]];rc=[0,0];rd=[false,false]},
start(k){return(function*(){const gs=[SA[k].f(rA),SA[sel2.value].f(rB)];while(!rd[0]||!rd[1]){for(let t=0;t<2;t++)if(!rd[t]){const r=gs[t].next();if(r.done){rd[t]=true;rh[t]=[]}else{rc[t]++;rh[t]=r.value}}yield}})()},
onStep(){},done(){},
key:[['b','Unsorted'],['a','Being compared or moved'],['c','Finished']],
draw(){g.textAlign='left';[[rA,0,sel.value],[rB,1,sel2.value]].forEach(([a,t,k])=>{const x0=t*W/2,w=(W/2-16)/N;a.forEach((v,i)=>{const h=v/N*(H-60);g.fillStyle=rd[t]?C.c:rh[t].includes(i)?C.a:C.b;g.fillRect(x0+8+i*w+1,H-h,w-2,h)});g.fillStyle=C.ink;g.font='bold 14px system-ui';g.fillText(SA[k].n+' · '+rc[t]+' steps'+(rd[t]?' ✓':''),x0+10,22)});g.strokeStyle=C.line;g.beginPath();g.moveTo(W/2,0);g.lineTo(W/2,H);g.stroke()}};

/* ---------- Scaling chart ---------- */
let cd=[];const NS=[10,20,40,60,80,110,140,170];
const chartM={algos:{x:{n:'Steps vs array size',i:'Comparisons and moves each sort needs as the array grows (square-root scale). Steeper curves are O(n²). New = fresh random data.'}},
fresh(){cd=Object.entries(SA).map(([k,a],j)=>({n:a.n,j,p:NS.map(n=>{const x=[...Array(n)].map((_,i)=>i+1).sort(()=>Math.random()-.5);let c=0;for(const _ of a.f(x))c++;return[n,c]})}))},
reset(){},start(){return(function*(){})()},onStep(){},done(){},key:[],
draw(){const L=70,R=190,T=20,B=44,pw=W-L-R,ph=H-T-B,mx=Math.max(...cd.flatMap(d=>d.p.map(q=>q[1]))),X=n=>L+n/170*pw,Y=c=>T+ph-Math.sqrt(c/mx)*ph;
g.font='12px system-ui';g.strokeStyle=C.line;g.fillStyle=C.mute;g.textAlign='center';
NS.forEach(n=>{g.beginPath();g.moveTo(X(n),T);g.lineTo(X(n),T+ph);g.stroke();g.fillText(n,X(n),T+ph+16)});
g.fillText('array size (n)',L+pw/2,H-8);g.textAlign='right';
[0,.25,.5,.75,1].forEach(f=>{const c=mx*f;g.fillText(Math.round(c),L-8,Y(c)+4)});
cd.forEach(d=>{const c=`hsl(${d.j*40},65%,50%)`;g.strokeStyle=c;g.lineWidth=2.5;g.beginPath();d.p.forEach(([n,v],i)=>i?g.lineTo(X(n),Y(v)):g.moveTo(X(n),Y(v)));g.stroke();g.fillStyle=c;g.fillRect(W-R+16,T+10+d.j*24,14,4);g.fillStyle=C.ink;g.textAlign='left';g.fillText(d.n,W-R+38,T+16+d.j*24)});g.lineWidth=1}};

/* ---------- Runner ---------- */
const M={sort:sortM,grid:gridM,graph:graphM,race:raceM,scale:chartM},sel=$('#sel'),sel2=$('#sel2');
const cur=()=>M[mode];
function draw(){col();g.clearRect(0,0,W,H);g.fillStyle=C.paper;g.fillRect(0,0,W,H);cur().draw();
$('#stat').textContent=steps+' steps'+(over=='nopath'?' · no path: the goal is walled off':'');
$('#desc').textContent=cur().algos[sel.value].i;$('#play').textContent=playing?'Pause':'Play'}
function step(){if(!gen)gen=cur().start(sel.value);const r=gen.next();if(r.done){cur().done();ended=true;return false}steps++;cur().onStep(r.value);return true}
function tick(){if(!playing)return;const s=+$('#spd').value,per=s>80?Math.ceil((s-80)/2):1;
for(let k=0;k<per;k++)if(!step()){playing=false;break}draw();if(playing)timer=setTimeout(tick,Math.round(500*Math.pow(.93,s)))}
function stop(){playing=false;clearTimeout(timer)}
function reset(){stop();ended=false;gen=null;steps=0;over=false;cur().reset();draw()}
function setMode(m){stop();ended=false;mode=m;document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m==m));
sel.innerHTML=Object.entries(cur().algos).map(([k,a])=>`<option value="${k}">${a.n}</option>`).join('');
sel2.hidden=mode!='race';if(mode=='race'){sel2.innerHTML=sel.innerHTML;sel2.value='quick'}$('#key').innerHTML=cur().key.map(([c,t])=>`<span><i style="background:${c=='b2'?'var(--b)':c=='ink'?'var(--ink)':'var(--'+c+')'};${c=='paper'?'border:1.5px solid var(--ink)':''}"></i>${t}</span>`).join('');
gen=null;steps=0;over=false;cur().fresh();draw()}
$('#tabs').onclick=e=>{if(e.target.dataset.m)setMode(e.target.dataset.m)};
sel.onchange=sel2.onchange=reset;$('#rst').onclick=reset;$('#new').onclick=()=>{stop();ended=false;gen=null;steps=0;over=false;cur().fresh();draw()};
$('#play').onclick=()=>{if(playing){stop();draw();return}if(ended)reset();playing=true;tick()};
$('#stp').onclick=()=>{stop();step();draw()};
$('#spd').oninput=()=>{};
cv.onpointerdown=e=>{if(mode!='grid')return;if(steps){reset()}cv.setPointerCapture(e.pointerId);const i=cell(e);if(i<0)return;paint=walls[i]?0:1;put(i)};
cv.onpointermove=e=>{if(paint<0)return;put(cell(e))};
cv.onpointerup=()=>paint=-1;
function cell(e){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*GW|0,y=(e.clientY-r.top)/r.height*GH|0;return x<0||y<0||x>=GW||y>=GH?-1:y*GW+x}
function put(i){if(i<0||i==S0||i==G0||walls[i]==paint)return;walls[i]=paint;draw()}
matchMedia('(prefers-color-scheme:dark)').onchange=draw;
setMode('sort');
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
